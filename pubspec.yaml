name: simple_pools
description: Offline fencing tournament organizer.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  cupertino_icons: 1.0.8
  drift: 2.28.2
  sqlite3_flutter_libs: 0.5.39
  path_provider: 2.1.5
  path: 1.9.1
  pdf: 3.11.3
  printing: 5.14.2
  file_picker: 10.3.3
  web: 1.1.1
dev_dependencies:
  crypto: 3.0.7
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  drift_dev: 2.28.2
  build_runner: 2.7.1
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
