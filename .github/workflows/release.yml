name: Build draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag (for example v1.0.0)
        required: true
        type: string
      sign_artifacts:
        description: Sign Android and iOS artifacts (requires signing secrets)
        type: boolean
        default: true
      ios_method:
        description: Apple export method matching the provisioning profile
        type: choice
        options: [app-store-connect, ad-hoc, enterprise, development]
        default: ad-hoc
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-artifacts.yml
    with:
      sign_artifacts: ${{ inputs.sign_artifacts }}
      ios_method: ${{ inputs.ios_method }}
    secrets: inherit
  draft:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-release'
          path: artifacts
          merge-multiple: true
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
          mapfile -d '' files < <(find artifacts -type f -print0)
          gh release create "$RELEASE_TAG" "${files[@]}" --draft --target "$GITHUB_SHA" --title "Simple Pools $RELEASE_TAG" --generate-notes
