name: Build release artifacts
on:
  workflow_dispatch:
    inputs:
      sign_artifacts:
        description: Sign Android and iOS artifacts (requires signing secrets)
        type: boolean
        default: false
      ios_method:
        description: Apple export method matching the provisioning profile
        type: choice
        options: [app-store-connect, ad-hoc, enterprise, development]
        default: ad-hoc
  workflow_call:
    inputs:
      sign_artifacts:
        description: Sign Android and iOS artifacts (requires signing secrets)
        type: boolean
        default: false
      ios_method:
        description: Apple export method matching the provisioning profile
        type: string
        default: ad-hoc
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      IOS_CERTIFICATE_BASE64:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_PROFILE_BASE64:
        required: false
      IOS_KEYCHAIN_PASSWORD:
        required: false
      IOS_TEAM_ID:
        required: false
      IOS_SIGNING_IDENTITY:
        required: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
  android:
    needs: checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Configure signing
        if: inputs.sign_artifacts
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import os, base64, pathlib
          for key in ['KEYSTORE', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS']:
              if not os.environ.get(key): raise SystemExit('Missing signing secret: ' + key)
          pathlib.Path('android/app/release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:').replace(' ', '\\ ')
          props = {'storeFile': 'release.jks', 'storePassword': os.environ['STORE_PASSWORD'], 'keyPassword': os.environ['KEY_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS']}
          pathlib.Path('android/key.properties').write_text('\n'.join(k + '=' + escape(v) for k, v in props.items()))
          PY
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release*.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Remove signing files
        if: ${{ always() && inputs.sign_artifacts }}
        run: rm -f android/key.properties android/app/release.jks
  ios:
    needs: checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build and package unsigned iOS app
        if: ${{ !inputs.sign_artifacts }}
        run: |
          flutter build ios --release --no-codesign
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app simple-pools-ios-unsigned.zip
      - name: Install signing certificate and profile
        if: inputs.sign_artifacts
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE" && test -n "$PROFILE" && test -n "$KEYCHAIN_PASSWORD"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
      - name: Build, sign and export installable IPA
        if: inputs.sign_artifacts
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.ios_method }}
          SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
        run: |
          test -n "$TEAM_ID" && test -n "$SIGNING_IDENTITY"
          flutter build ios --release --no-codesign
          ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          project.targets.select { |target| target.name == 'Runner' }.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('TEAM_ID')
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_UUID')
              config.build_settings['CODE_SIGN_IDENTITY'] = ENV.fetch('SIGNING_IDENTITY')
            end
          end
          project.save
          RUBY
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' -archivePath build/ios/archive/Runner.xcarchive archive
          python3 - <<'PY'
          import os, plistlib
          options = {'method': os.environ['EXPORT_METHOD'], 'teamID': os.environ['TEAM_ID'], 'signingStyle': 'manual', 'signingCertificate': os.environ['SIGNING_IDENTITY'], 'provisioningProfiles': {'org.simplepools.simplePools': os.environ['PROFILE_UUID']}, 'uploadSymbols': False, 'manageAppVersionAndBuildNumber': False}
          with open('ExportOptions.plist', 'wb') as f: plistlib.dump(options, f)
          PY
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/ios/ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-release
          path: ${{ inputs.sign_artifacts && 'build/ios/ipa/*.ipa' || 'simple-pools-ios-unsigned.zip' }}
          if-no-files-found: error
      - name: Remove signing material
        if: ${{ always() && inputs.sign_artifacts }}
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [ -n "$PROFILE_UUID" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
  web:
    needs: checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --release --no-web-resources-cdn --pwa-strategy=none
      - run: dart run tool/build_offline.dart
      - run: cd build/web && zip -r ../../simple-pools-web.zip .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-release
          path: simple-pools-web.zip
          if-no-files-found: error
